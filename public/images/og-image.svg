<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F7F3EA" />
  
  <!-- Subtle Grid Pattern -->
  <circle cx="200" cy="150" r="140" fill="#C8B7FF" opacity="0.3" filter="blur(40px)" />
  <circle cx="1000" cy="450" r="180" fill="#C6F36A" opacity="0.3" filter="blur(50px)" />

  <!-- Top Bezel -->
  <rect x="0" y="0" width="1200" height="12" fill="#171717" />

  <!-- Hanging Companions -->
  <path d="M 300 12 L 300 180" stroke="#77736D" stroke-width="4" />
  <circle cx="300" cy="220" r="40" fill="#C6F36A" stroke="#171717" stroke-width="5" />
  
  <path d="M 600 12 L 600 240" stroke="#77736D" stroke-width="4" />
  <circle cx="600" cy="290" r="50" fill="#C8B7FF" stroke="#171717" stroke-width="5" />

  <path d="M 900 12 L 900 160" stroke="#77736D" stroke-width="4" />
  <circle cx="900" cy="200" r="38" fill="#FF9D68" stroke="#171717" stroke-width="5" />

  <!-- Title Text -->
  <text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="64" fill="#171717" letter-spacing="-2">SWINGLY</text>
  <text x="600" y="500" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="28" fill="#77736D">Give Your Desktop a Little Personality</text>
</svg>
